name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: '3.14'
        enable-cache: true

    - name: Install project
      run: uv sync --frozen

    - name: Run linting
      run: uv run ruff check .

    - name: Run type checking
      run: uv run poe typecheck

    - name: Run tests
      run: uv run pytest

  integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: '3.14'
        enable-cache: true

    - name: Install project
      run: uv sync --frozen

    - name: Prepare env file for compose
      run: cp env.test .env

    - name: Start app via docker compose
      run: docker compose up -d --build

    - name: Wait for app to become healthy
      run: |
        for i in $(seq 1 60); do
          if curl -fsS http://localhost:8000/api/ping >/dev/null; then
            echo "App is up after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "App failed to become healthy in 60s" >&2
        exit 1

    - name: Run integration tests
      run: uv run pytest integration/ --no-cov -v

    - name: Dump app logs
      if: always()
      run: docker compose logs app

    - name: Tear down compose stack
      if: always()
      run: docker compose down -v
